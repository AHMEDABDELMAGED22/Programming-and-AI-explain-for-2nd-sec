<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- Phone frame -->
  <rect x="250" y="80" width="180" height="340" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="260" y="110" width="160" height="280" rx="4" fill="#e2e8f0"/>
  <!-- Camera -->
  <circle cx="340" cy="96" r="5" fill="#475569"/>
  <!-- Screen content - real world -->
  <rect x="260" y="110" width="160" height="280" fill="#bae6fd"/>
  <rect x="260" y="300" width="160" height="90" fill="#86efac"/>
  <!-- AR overlays -->
  <rect x="280" y="150" width="80" height="30" rx="6" fill="#7c3aed" opacity="0.8"/>
  <text x="320" y="170" text-anchor="middle" fill="white" font-size="12" font-weight="bold">INFO</text>
  <circle cx="350" cy="250" r="25" fill="#f97316" opacity="0.6" stroke="#f97316" stroke-width="2"/>
  <text x="350" y="255" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3D</text>
  <rect x="275" y="320" width="90" height="20" rx="4" fill="#2563eb" opacity="0.7"/>
  <text x="320" y="334" text-anchor="middle" fill="white" font-size="10">Direction →</text>
  <!-- AR lines from phone -->
  <line x1="430" y1="180" x2="550" y2="150" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <line x1="430" y1="250" x2="580" y2="280" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Real world objects -->
  <rect x="500" y="120" width="120" height="80" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="560" y="165" text-anchor="middle" fill="#64748b" font-size="14">Building</text>
  <circle cx="600" cy="280" r="30" fill="#bbf7d0" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="285" text-anchor="middle" fill="#15803d" font-size="10">Tree</text>
  <!-- Labels -->
  <text x="400" y="480" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="bold" font-family="sans-serif">Augmented Reality</text>
  <text x="400" y="510" text-anchor="middle" fill="#64748b" font-size="16" font-family="sans-serif">Digital layers added to the real world</text>
  <text x="400" y="540" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">الواقع المعزز</text>
</svg>
