<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- VR Headset -->
  <rect x="280" y="120" width="240" height="140" rx="30" fill="#1e293b"/>
  <rect x="290" y="130" width="100" height="80" rx="10" fill="#3b82f6" opacity="0.3"/>
  <rect x="410" y="130" width="100" height="80" rx="10" fill="#3b82f6" opacity="0.3"/>
  <!-- Lenses -->
  <circle cx="340" cy="170" r="30" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="460" cy="170" r="30" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Strap -->
  <path d="M280 190 Q200 190 200 160 Q200 130 280 130" stroke="#334155" stroke-width="8" fill="none"/>
  <path d="M520 190 Q600 190 600 160 Q600 130 520 130" stroke="#334155" stroke-width="8" fill="none"/>
  <!-- Virtual world emerging -->
  <circle cx="400" cy="350" r="100" fill="#7c3aed" opacity="0.1"/>
  <circle cx="400" cy="350" r="70" fill="#7c3aed" opacity="0.15"/>
  <circle cx="400" cy="350" r="40" fill="#7c3aed" opacity="0.2"/>
  <!-- Virtual elements -->
  <polygon points="370,310 400,280 430,310" fill="#3b82f6" opacity="0.6"/>
  <rect x="350" y="350" width="40" height="40" rx="4" fill="#f97316" opacity="0.6" transform="rotate(15,370,370)"/>
  <circle cx="440" cy="370" r="20" fill="#22c55e" opacity="0.6"/>
  <!-- Particles -->
  <circle cx="320" cy="320" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="480" cy="340" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="360" cy="400" r="3" fill="#f97316" opacity="0.5"/>
  <circle cx="450" cy="300" r="5" fill="#22c55e" opacity="0.5"/>
  <circle cx="340" cy="380" r="3" fill="#8b5cf6" opacity="0.5"/>
  <!-- Labels -->
  <text x="400" y="490" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="bold" font-family="sans-serif">Virtual Reality</text>
  <text x="400" y="520" text-anchor="middle" fill="#64748b" font-size="16" font-family="sans-serif">Immersion in a computer-generated world</text>
  <text x="400" y="550" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">الواقع الافتراضي</text>
</svg>
